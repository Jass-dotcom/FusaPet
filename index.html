<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FusaPet - Inicio de Sesión</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <div class="container">
    <h2>FusaPet</h2>
    
    <!-- Formulario de Login -->
    <form id="login-form" class="form">
      <div class="form-group">
        <label for="login-email">Correo electrónico</label>
        <input type="email" id="login-email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Iniciar Sesión</button>
      <div class="link">
        <a id="register-link">Crear cuenta</a>
      </div>
    </form>
    
    <!-- Formulario de Registro -->
    <form id="register-form" class="form hidden">
      <div class="form-group">
        <label for="register-name">Nombre</label>
        <input type="text" id="register-name" required placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label for="register-email">Correo electrónico</label>
        <input type="email" id="register-email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="register-password">Contraseña</label>
        <input type="password" id="register-password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn">Crear Cuenta</button>
      <div class="link">
        <a id="login-link">Ya tienes cuenta?</a>
      </div>
    </form>
  </div>
  <script src="src/js/script.js"></script>
</body>
</html>
